name: release-please

# Conventional commits -> release PR (version bump + CHANGELOG) -> merge -> tag + GitHub Release,
# then the same run builds and attaches the binaries.
#
# Why the build lives here and not only in release.yaml: releases created with the
# default GITHUB_TOKEN do not trigger further workflows (GitHub anti-recursion), so a
# tag created by release-please would never start a separate tag-driven workflow.
# release.yaml still exists for workflow_dispatch re-attachments.
#
# Distribution channels release-please cannot maintain (it only bumps the crate
# version + CHANGELOG) are synced by the `sync-manifests` job below: the Homebrew
# formula (Formula/tresor.rb, consumed via `brew tap njoerd114/tresor <repo-url>`)
# plus the scoop manifest and AUR PKGBUILD. It lands via an auto-merged PR, because
# `main` is protected by a ruleset that rejects direct pushes.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          # macOS 13 (Intel) runners are retired — cross-compile x86_64 from the arm64 runner.
          - { runner: macos-latest, target: x86_64-apple-darwin }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        run: |
          set -euo pipefail
          cp "target/${{ matrix.target }}/release/tresor" "tresor-${{ matrix.target }}"
          tar czf "tresor-${{ matrix.target }}.tar.gz" "tresor-${{ matrix.target }}"

      - name: Package (windows)
        if: ${{ contains(matrix.target, 'windows') }}
        shell: bash
        run: |
          set -euo pipefail
          cp "target/${{ matrix.target }}/release/tresor.exe" "tresor-${{ matrix.target }}.exe"
          7z a "tresor-${{ matrix.target }}.zip" "tresor-${{ matrix.target }}.exe"

      - name: Upload linux binary for packaging
        if: ${{ contains(matrix.target, 'linux') }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.target }}
          path: tresor-${{ matrix.target }}

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: |
            tresor-*.tar.gz
            tresor-*.zip

  packages:
    needs: [release, build]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    name: packages (deb/rpm/apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: linux-*

      - name: Install nfpm
        run: |
          set -euo pipefail
          # Go is preinstalled on runners; this avoids coupling to nfpm's asset naming.
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build packages
        run: |
          set -euo pipefail
          VERSION="${{ needs.release.outputs.version }}"
          mkdir -p dist
          declare -A ARCH=( [amd64]="x86_64-unknown-linux-gnu" [arm64]="aarch64-unknown-linux-gnu" )
          for arch in "${!ARCH[@]}"; do
            target="${ARCH[$arch]}"
            cp "artifacts/linux-${target}/tresor-${target}" "./tresor-linux-bin"
            for packager in deb rpm apk; do
              NFPM_ARCH="$arch" NFPM_VERSION="$VERSION" \
                nfpm package --packager "$packager" --config nfpm.yaml \
                --target "dist/tresor_${VERSION}_linux_${arch}.${packager}"
            done
          done
          ls -l dist

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: dist/*

  sync-manifests:
    # `build` must finish first: the hashes are computed from the release assets
    # it uploads, so a `needs: release`-only job would race the upload.
    needs: [release, build]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    name: sync packaging manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Rewrite Homebrew + scoop + AUR manifests
        env:
          VERSION: ${{ needs.release.outputs.version }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          scripts/sync-packaging.sh "$VERSION" "$TAG"

      - name: Open and merge a sync PR
        # `main` is protected by a repository ruleset (pull_request + signed commits,
        # no bypass actors), so a direct `git push` is rejected with
        # "push declined due to repository rule violations". Open a PR instead and
        # squash-merge it through the API — GitHub signs the resulting commit, which
        # satisfies the ruleset.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "manifests already current"
            exit 0
          fi

          branch="chore/packaging-sync-${TAG}"
          title="chore(packaging): sync Homebrew + scoop + AUR for ${TAG}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "$title"
          git push -u origin "$branch"

          gh pr create --base main --head "$branch" --title "$title" --body \
            "Automated: regenerated \`Formula/tresor.rb\`, \`packaging/scoop/tresor.json\` and \`packaging/aur/PKGBUILD\` from the ${TAG} release assets (version + sha256). Produced by the \`sync-manifests\` job; opened as a PR because \`main\` requires pull requests."

          # GitHub computes mergeability asynchronously; retry until the PR is mergeable.
          for attempt in $(seq 1 12); do
            if gh pr merge "$branch" --squash --delete-branch; then
              exit 0
            fi
            echo "merge attempt ${attempt} failed; retrying in 10s" >&2
            sleep 10
          done
          echo "error: could not merge ${branch}" >&2
          exit 1
