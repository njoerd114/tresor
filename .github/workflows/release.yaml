name: release

# Tag-driven builds for manually created tags. Note: tags created by release-please
# with the default GITHUB_TOKEN do NOT trigger this workflow (anti-recursion) — the
# automatic path builds inside release-please.yml. Use workflow_dispatch here to
# (re-)attach binaries to any existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries for (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          # macOS 13 (Intel) runners are retired — cross-compile x86_64 from the arm64 runner.
          - { runner: macos-latest, target: x86_64-apple-darwin }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        run: |
          set -euo pipefail
          cp "target/${{ matrix.target }}/release/tresor" "tresor-${{ matrix.target }}"
          tar czf "tresor-${{ matrix.target }}.tar.gz" "tresor-${{ matrix.target }}"

      - name: Package (windows)
        if: ${{ contains(matrix.target, 'windows') }}
        shell: bash
        run: |
          set -euo pipefail
          cp "target/${{ matrix.target }}/release/tresor.exe" "tresor-${{ matrix.target }}.exe"
          7z a "tresor-${{ matrix.target }}.zip" "tresor-${{ matrix.target }}.exe"

      # Linux binaries are reused to build distro packages in the next job.
      - name: Upload linux binary for packaging
        if: ${{ contains(matrix.target, 'linux') }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: tresor-${{ matrix.target }}

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tresor-*.tar.gz
            tresor-*.zip
          generate_release_notes: true

  packages:
    name: packages (deb/rpm/apk)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: linux-*

      - name: Install nfpm
        run: |
          set -euo pipefail
          # Go is preinstalled on runners; this avoids coupling to nfpm's asset naming.
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build packages
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist
          declare -A ARCH=( [amd64]="x86_64-unknown-linux-gnu" [arm64]="aarch64-unknown-linux-gnu" )
          for arch in "${!ARCH[@]}"; do
            target="${ARCH[$arch]}"
            cp "artifacts/linux-${target}/tresor-${target}" "./tresor-linux-bin"
            for packager in deb rpm apk; do
              NFPM_ARCH="$arch" NFPM_VERSION="$VERSION" \
                nfpm package --packager "$packager" --config nfpm.yaml \
                --target "dist/tresor_${VERSION}_linux_${arch}.${packager}"
            done
          done
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false
